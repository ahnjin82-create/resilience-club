<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRQ-53 회복탄력성 검사</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --navy:#1B3A6B; --teal:#028090; --mint:#02C39A; --coral:#FF6B4A;
    --ink:#1B2436; --muted:#6b7280; --line:#e5e7eb; --bg:#fafaf8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:80px;}

  .progress-bar{position:sticky;top:0;z-index:20;background:var(--navy);padding:10px 16px;}
  .progress-track{background:rgba(255,255,255,0.2);border-radius:999px;height:8px;overflow:hidden;}
  .progress-fill{background:var(--mint);height:100%;width:0%;transition:width .2s;}
  .progress-label{color:#fff;font-size:12px;font-weight:700;margin-top:6px;text-align:center;}

  .hero{padding:26px 20px 20px;text-align:center;background:#fff;border-bottom:1px solid var(--line);}
  .hero .eyebrow{color:var(--coral);font-weight:700;font-size:12px;letter-spacing:.08em;margin:0 0 6px;}
  .hero h1{font-size:21px;margin:0 0 6px;color:var(--navy);}
  .hero .sub{color:var(--muted);font-size:13px;margin:0;}

  .id-card{max-width:560px;margin:16px auto;padding:0 16px;}
  .id-row{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .id-field{flex:1;}
  .id-field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:4px;}
  .id-field input{width:100%;border:1.6px solid #d8dce4;border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;}

  .scale-guide{
    max-width:560px;margin:0 auto 10px;padding:0 16px;
  }
  .scale-guide-inner{
    background:#EAF3FB;border-radius:10px;padding:10px 14px;font-size:12px;color:#2b3b52;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;
  }

  .q-list{max-width:560px;margin:0 auto;padding:0 16px;}
  .q-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;
  }
  .q-num{
    display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:6px;margin-bottom:8px;
  }
  .q-text{font-size:14.5px;font-weight:500;margin-bottom:10px;color:var(--ink);}
  .q-options{display:flex;justify-content:space-between;gap:4px;}
  .opt{flex:1;text-align:center;}
  .opt input{display:none;}
  .opt label{
    display:block;border:1.6px solid #d8dce4;border-radius:8px;padding:8px 2px;
    font-size:12px;color:var(--muted);cursor:pointer;transition:all .12s;
  }
  .opt input:checked + label{
    background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;
  }

  .submit-zone{max-width:560px;margin:20px auto;padding:0 16px;}
  button.submit{
    width:100%;background:var(--coral);color:#fff;border:none;border-radius:14px;
    padding:16px;font-size:17px;font-weight:900;cursor:pointer;
  }
  button.submit:disabled{opacity:.5;cursor:not-allowed;}
  .error-msg{color:#b91c1c;font-size:13px;font-weight:700;text-align:center;margin-top:10px;display:none;}

  .done-screen{display:none;text-align:center;padding:70px 20px;}
  .done-screen.show{display:block;}
  .badge-circle{
    width:88px;height:88px;border-radius:50%;background:var(--mint);
    margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;
  }
  .done-title{font-size:22px;font-weight:900;color:var(--navy);margin:0 0 8px;}
  .done-sub{font-size:14px;color:var(--muted);max-width:320px;margin:0 auto;}

  .footer-note{text-align:center;font-size:11px;color:#9ca3af;padding:20px;}
</style>
</head>
<body>

<div class="progress-bar">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 53 응답</div>
</div>

<div id="formWrap">
  <div class="hero">
    <p class="eyebrow">회복탄력성 동아리 「다시봄」</p>
    <h1>KRQ-53 회복탄력성 검사</h1>
    <p class="sub">솔직하게, 지금 나의 느낌 그대로 답해주세요 · 결과는 공개되지 않아요</p>
  </div>

  <div class="id-card">
    <div class="id-row">
      <div class="id-field">
        <label for="grpNo">모둠 번호</label>
        <input type="text" id="grpNo" inputmode="numeric" placeholder="예: 3">
      </div>
      <div class="id-field">
        <label for="stuName">이름</label>
        <input type="text" id="stuName" placeholder="이름 입력">
      </div>
    </div>
  </div>

  <div class="scale-guide">
    <div class="scale-guide-inner">
      <span>1 전혀 아니다</span><span>2 아니다</span><span>3 보통</span><span>4 그렇다</span><span>5 매우 그렇다</span>
    </div>
  </div>

  <div class="q-list" id="qList"></div>

  <div class="submit-zone">
    <button class="submit" id="submitBtn" onclick="submitKRQ()">제출하기</button>
    <p class="error-msg" id="errorMsg"></p>
  </div>

  <p class="footer-note">KRQ-53 (Korean Resilience Quotient) · 김주환(2011) 「회복탄력성」 기반</p>
</div>

<div class="done-screen" id="doneScreen">
  <div class="badge-circle">✓</div>
  <p class="done-title">검사 완료!</p>
  <p class="done-sub">수고했어요. 오늘 기록한 이 결과는 17주 뒤 다시 만나게 될 거예요.</p>
</div>

<script>
  // ⚠️ 아래 URL을 본인의 Google Apps Script 웹앱 배포 URL로 교체하세요.
  const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbxUaj9K9wt-2_yrfC6PG-DxKtThL2M5yUgqFFtA2qElUHpAGchy_gARzzYhZqKRU-Tr/exec";

  const QUESTIONS = [
    "나는 어려운 일이 닥쳤을 때 감정을 통제할 수 있다.",
    "내가 무슨 생각을 하면, 그 생각이 내 기분에 어떤 영향을 미칠지 잘 알아챈다.",
    "논쟁거리가 되는 문제를 가족이나 친구들과 토론할 때 내 감정을 잘 통제할 수 있다.",
    "집중해야 할 중요한 일이 생기면 신바람이 나기보다는 더 스트레스를 받는 편이다.",
    "나는 내 감정에 잘 휘말린다.",
    "때때로 내 감정적인 문제 때문에 학교나 일상에서 집중하기 힘들다.",
    "당장 해야 할 일이 있으면 나는 어떠한 유혹이나 방해도 잘 이겨내고 할 일을 한다.",
    "아무리 당황스럽고 어려운 상황이 닥쳐도, 나는 내가 어떤 생각을 하고 있는지 스스로 잘 안다.",
    "누군가가 나에게 화를 낼 경우 나는 우선 그 사람의 의견을 잘 듣는다.",
    "일이 생각대로 잘 안 풀리면 쉽게 포기하는 편이다.",
    "평소 시간이나 용돈 계획에 대해 별 다른 계획 없이 지낸다.",
    "미리 계획을 세우기보다는 즉흥적으로 일을 처리하는 편이다.",
    "문제가 생기면 여러 가지 가능한 해결 방안에 대해 먼저 생각한 후에 해결하려고 노력한다.",
    "어려운 일이 생기면 그 원인이 무엇인지 신중하게 생각한 후에 그 문제를 해결하려고 노력한다.",
    "나는 대부분의 상황에서 문제의 원인을 잘 알고 있다고 믿는다.",
    "나는 사건이나 상황을 잘 파악하지 못한다는 이야기를 종종 듣는다.",
    "문제가 생기면 나는 성급하게 결론을 내린다는 이야기를 종종 듣는다.",
    "어려운 일이 생기면 그 원인을 완전히 이해하지 못했다 하더라도 일단 빨리 해결하는 것이 좋다고 생각한다.",
    "나는 분위기나 대화 상대에 따라 대화를 잘 이끌어 갈 수 있다.",
    "나는 재치 있는 농담을 잘한다.",
    "나는 내가 표현하고자 하는 바에 대한 적절한 문구나 단어를 잘 찾아낸다.",
    "나는 윗사람(선생님, 어른)과 대화하는 것이 부담스럽다.",
    "나는 대화 중에 다른 생각을 하느라 대화 내용을 놓칠 때가 종종 있다.",
    "대화를 할 때 하고 싶은 말을 다 하지 못하고 주저할 때가 종종 있다.",
    "사람들의 얼굴 표정을 보면 어떤 감정인지 알 수 있다.",
    "슬퍼하거나 화를 내거나 당황하는 사람을 보면 그들이 어떤 생각을 하는지 잘 알 수 있다.",
    "친구가 화를 낼 경우 나는 그 이유를 꽤 잘 아는 편이다.",
    "나는 사람들의 행동방식을 때로 이해하기 힘들다.",
    "친한 친구로부터 “너는 나를 이해 못 해”라는 말을 종종 듣는다.",
    "친구들은 내가 자기 말을 잘 듣지 않는다고 한다.",
    "나는 내 주변 사람들로부터 사랑과 관심을 받고 있다.",
    "나는 내 친구들을 정말로 좋아한다.",
    "내 주변 사람들은 내 기분을 잘 이해한다.",
    "서로 도움을 주고받는 친구가 별로 없는 편이다.",
    "나는 정기적으로 만나는 사람들이 대부분 나를 싫어하게 된다고 느낀다.",
    "서로 마음을 터놓고 얘기할 수 있는 친구가 거의 없다.",
    "열심히 하면 언제나 보답이 있으리라고 생각한다.",
    "맞든 아니든 “아무리 어려운 문제라도 나는 해결할 수 있다”라고 일단 믿는 것이 좋다고 생각한다.",
    "어려운 상황이 닥쳐도 나는 모든 일이 다 잘 해결될 거라고 확신한다.",
    "내가 어떤 일을 마치고 나면, 주변 사람들이 부정적인 평가를 할까 봐 걱정한다.",
    "나에게 일어나는 대부분의 문제들은 나로서는 어쩔 수 없는 상황에 의해 발생한다고 믿는다.",
    "누가 나의 미래에 대해 물어보면 성공한 나의 모습을 상상하기 힘들다.",
    "내 삶은 내가 생각하는 이상적인 삶에 가깝다.",
    "내 생활의 여러 가지 조건들은 만족스럽다.",
    "나는 내 삶에 만족한다.",
    "나는 내 삶에서 중요하다고 생각한 것들은 다 갖고 있다.",
    "나는 다시 태어나도 나의 현재 삶을 다시 살고 싶다.",
    "나는 다양한 사람들에게 고마움을 느낀다.",
    "내가 고맙게 여기는 것들을 모두 적는다면 아주 긴 목록이 될 것이다.",
    "시간이 지날수록 내 삶의 일부가 된 사람, 사건, 생활에 대해 감사하는 마음이 더 커져간다.",
    "나는 감사해야 할 것이 별로 없다.",
    "세상을 둘러볼 때, 내가 고마워할 것은 별로 없다.",
    "사람이나 일에 대한 고마움을 한참 시간이 지난 후에야 겨우 느낀다.",
  ];

  const qList = document.getElementById('qList');
  QUESTIONS.forEach((text, i) => {
    const n = i + 1;
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = `
      <span class="q-num">Q${n}</span>
      <p class="q-text">${text}</p>
      <div class="q-options">
        ${[1,2,3,4,5].map(v => `
          <div class="opt">
            <input type="radio" name="q${n}" id="q${n}_${v}" value="${v}" onchange="updateProgress()">
            <label for="q${n}_${v}">${v}</label>
          </div>
        `).join('')}
      </div>
    `;
    qList.appendChild(card);
  });

  function updateProgress(){
    let answered = 0;
    for (let i = 1; i <= 53; i++) {
      if (document.querySelector(`input[name="q${i}"]:checked`)) answered++;
    }
    document.getElementById('progressFill').style.width = (answered / 53 * 100) + '%';
    document.getElementById('progressLabel').textContent = `${answered} / 53 응답`;
  }

  function submitKRQ(){
    const grpNo = document.getElementById('grpNo').value.trim();
    const stuName = document.getElementById('stuName').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    let answers = {};
    let missing = [];
    for (let i = 1; i <= 53; i++) {
      const sel = document.querySelector(`input[name="q${i}"]:checked`);
      if (!sel) missing.push(i);
      else answers['q' + i] = sel.value;
    }

    if (!stuName || missing.length > 0) {
      errorMsg.textContent = stuName
        ? `아직 답하지 않은 문항이 ${missing.length}개 있어요 (${missing.slice(0,5).join(', ')}${missing.length>5?' 외':''})`
        : "이름을 입력해주세요.";
      errorMsg.style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    errorMsg.style.display = "none";

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "저장 중...";

    const params = new URLSearchParams({
      timestamp: new Date().toISOString(),
      group: grpNo,
      name: stuName,
      phase: "pre",
      ...answers
    });

    fetch(SHEET_ENDPOINT + "?" + params.toString(), { method: "GET", mode: "no-cors" })
      .then(() => {
        document.getElementById('formWrap').style.display = 'none';
        document.getElementById('doneScreen').classList.add('show');
      })
      .catch(() => {
        errorMsg.textContent = "저장에 실패했어요. 다시 시도해주세요.";
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "제출하기";
      });
  }
</script>

</body>
</html>

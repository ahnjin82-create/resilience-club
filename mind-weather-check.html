<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음날씨 체크리스트 — POGOK WELL+</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --navy:#1B3A6B; --teal:#028090; --mint:#02C39A; --coral:#FF6B4A;
    --ink:#1B2436; --muted:#6b7280; --line:#e5e7eb; --bg:#fafaf8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px;}

  .wrap{max-width:560px;margin:0 auto;}
  .wrap.hidden{display:none;}

  .hero{padding:26px 20px 20px;background:var(--navy);text-align:center;}
  .hero .eyebrow{color:var(--mint);font-weight:700;font-size:12px;letter-spacing:.08em;margin:0 0 6px;}
  .hero h1{font-size:22px;margin:0 0 6px;color:#fff;}
  .hero .sub{color:#B9C6E0;font-size:13px;margin:0;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 14px 0;}
  .card-title{font-size:14px;font-weight:900;color:var(--navy);margin:0 0 10px;display:flex;align-items:center;gap:6px;}
  .step-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
    font-size:11px;font-weight:900;
  }

  .id-grid{display:flex;gap:8px;}
  .id-field{flex:1;}
  .id-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:4px;}
  .id-field input{width:100%;border:1.6px solid #d8dce4;border-radius:8px;padding:9px 8px;font-size:14px;font-family:inherit;}
  .id-field input::placeholder{color:#b7bec9;font-style:italic;}
  .id-field input:focus{border-color:var(--coral);}

  .weather-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .weather-opt{
    text-align:center;border:2px solid #eef0f2;border-radius:10px;padding:8px 2px;cursor:pointer;
    transition:all .12s;
  }
  .weather-opt .emoji{font-size:22px;display:block;margin-bottom:2px;}
  .weather-opt .name{font-size:10px;font-weight:700;color:#374151;}
  .weather-opt.selected{border-color:var(--coral);background:#FFF3EF;}
  @media (max-width:420px){ .weather-grid{grid-template-columns:repeat(5,1fr);} .weather-opt .name{font-size:9px;} }

  .temp-grid{display:flex;gap:6px;}
  .temp-opt{
    flex:1;text-align:center;border:2px solid #eef0f2;border-radius:10px;padding:10px 2px;cursor:pointer;
    font-size:11px;font-weight:700;color:#374151;transition:all .12s;
  }
  .temp-opt.selected{border-color:var(--teal);background:#EAF6F4;color:var(--teal);}

  textarea{
    width:100%;min-height:60px;border:1.6px solid #d8dce4;border-radius:9px;padding:10px 12px;
    font-size:14px;font-family:inherit;resize:vertical;background:#fbfbfa;
  }
  .hint{font-size:11px;color:var(--muted);margin-top:6px;}

  .submit-zone{margin:20px 14px 0;}
  button.submit{
    width:100%;background:var(--coral);color:#fff;border:none;border-radius:14px;
    padding:16px;font-size:16px;font-weight:900;cursor:pointer;
  }
  button.submit:disabled{opacity:.5;cursor:not-allowed;}
  .error-msg{color:#b91c1c;font-size:13px;font-weight:700;text-align:center;margin-top:10px;display:none;}

  .result-screen{display:none;padding:20px 16px 40px;}
  .result-screen.show{display:block;}
  .result-hero{text-align:center;padding:10px 0 18px;}
  .result-hero .icon{font-size:48px;}
  .result-title{font-size:19px;font-weight:900;color:var(--navy);margin:6px 0 0;}
  .prescription-card{
    background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;text-align:center;
  }
  .prescription-card .rx-title{font-size:16px;font-weight:900;margin-bottom:10px;}
  .prescription-card .rx-body{font-size:14.5px;color:#374151;line-height:1.6;}
  .done-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px;}
</style>
</head>
<body>

<div class="wrap" id="formWrap">
  <div class="hero">
    <p class="eyebrow">POGOK WELL+ · 2026 마음날씨 캠페인</p>
    <h1>오늘 내 마음 날씨는 어때요?</h1>
    <p class="sub">내 감정을 날씨로 표현하며 알아차리는 시간 · 솔직하게 적어도 비밀은 지켜져요</p>
  </div>

  <div class="card">
    <p class="card-title"><span class="step-num">1</span> 학년 · 반 · 번호 · 이름</p>
    <div class="id-grid">
      <div class="id-field"><label>학년</label><input type="text" id="grade" inputmode="numeric" placeholder="예)2"></div>
      <div class="id-field"><label>반</label><input type="text" id="classNo" inputmode="numeric" placeholder="예)3"></div>
      <div class="id-field"><label>번호</label><input type="text" id="stuNo" inputmode="numeric" placeholder="예)15"></div>
      <div class="id-field" style="flex:1.4"><label>이름</label><input type="text" id="stuName" placeholder="이름"></div>
    </div>
  </div>

  <div class="card">
    <p class="card-title"><span class="step-num">2</span> 지금 내 마음 날씨를 골라보세요</p>
    <div class="weather-grid" id="weatherGrid"></div>
  </div>

  <div class="card">
    <p class="card-title"><span class="step-num">3</span> 지금 내 마음의 온도는?</p>
    <div class="temp-grid" id="tempGrid"></div>
  </div>

  <div class="card">
    <p class="card-title"><span class="step-num">4</span> 오늘 이 날씨가 된 이유가 있나요?</p>
    <textarea id="reason" placeholder="예) 친구랑 싸워서 / 시험이 걱정돼서 / 그냥 모르겠어서..."></textarea>
    <p class="hint">한 줄만 적어도 OK!</p>
  </div>

  <div class="submit-zone">
    <button class="submit" id="submitBtn" onclick="submitWeather()">제출하기</button>
    <p class="error-msg" id="errorMsg"></p>
  </div>
</div>

<div class="result-screen" id="resultScreen">
  <div class="result-hero">
    <div class="icon" id="resultIcon">☀️</div>
    <p class="result-title">마음날씨 기록 완료!</p>
  </div>
  <div class="prescription-card">
    <p class="rx-title" id="rxTitle">맑음이라면</p>
    <p class="rx-body" id="rxBody">좋은 에너지를 친구에게도 나눠줘요. 칭찬 한 마디가 햇살이 돼요!</p>
  </div>
  <p class="done-note">궁금한 점이나 힘든 일이 있으면 언제든 보건실로 오세요 😊</p>
</div>

<script>
  // ⚠️ 아래 URL을 본인의 Google Apps Script 웹앱 배포 URL로 교체하세요.
  const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbzkF9kJKuC3_GD-CrLYIm58WYK6e3mJG5GbUq3aG4B39sym7Ml3VYBOLe4q58TUELXK/exec";

  const WEATHERS = [
    { key: "맑음", emoji: "☀️", cat: "맑음" },
    { key: "구름조금", emoji: "⛅", cat: "맑음" },
    { key: "흐림", emoji: "☁️", cat: "흐림" },
    { key: "비", emoji: "🌧", cat: "비" },
    { key: "폭풍", emoji: "⛈", cat: "폭풍" },
    { key: "비후맑음", emoji: "🌈", cat: "맑음" },
    { key: "안개", emoji: "🌫", cat: "흐림" },
    { key: "바람", emoji: "🌬", cat: "흐림" },
    { key: "눈추위", emoji: "❄️", cat: "흐림" },
    { key: "밤하늘", emoji: "🌙", cat: "흐림" },
  ];
  const TEMPS = ["아주차분", "차분", "보통", "조금뜨거워", "매우뜨거워"];
  const PRESCRIPTIONS = {
    "맑음": { icon: "☀️", title: "맑음이라면", body: "좋은 에너지를 친구에게도 나눠줘요. 칭찬 한 마디가 햇살이 돼요!" },
    "흐림": { icon: "⛅", title: "흐림이라면", body: "억지로 웃지 않아도 돼요. 창밖 보며 숨 세 번 깊게 쉬어보세요 🌿" },
    "비":   { icon: "🌧", title: "비가 온다면", body: "혼자 있고 싶을 수 있어요. 보건실 문은 언제나 열려 있어요 🫧" },
    "폭풍": { icon: "⛈", title: "폭풍이라면", body: "지금 정말 힘들 거예요. 선생님이나 친구에게 꼭 이야기해 줘요 💙" },
  };

  let selectedWeather = null, selectedTemp = null;

  const weatherGrid = document.getElementById('weatherGrid');
  WEATHERS.forEach(w => {
    const el = document.createElement('div');
    el.className = 'weather-opt';
    el.innerHTML = `<span class="emoji">${w.emoji}</span><span class="name">${w.key}</span>`;
    el.onclick = () => {
      document.querySelectorAll('.weather-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedWeather = w;
    };
    weatherGrid.appendChild(el);
  });

  const tempGrid = document.getElementById('tempGrid');
  TEMPS.forEach(t => {
    const el = document.createElement('div');
    el.className = 'temp-opt';
    el.textContent = t;
    el.onclick = () => {
      document.querySelectorAll('.temp-opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedTemp = t;
    };
    tempGrid.appendChild(el);
  });

  function submitWeather(){
    const grade = document.getElementById('grade').value.trim();
    const classNo = document.getElementById('classNo').value.trim();
    const stuNo = document.getElementById('stuNo').value.trim();
    const stuName = document.getElementById('stuName').value.trim();
    const reason = document.getElementById('reason').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if(!stuName || !grade || !classNo || !stuNo || !selectedWeather || !selectedTemp){
      errorMsg.textContent = "이름ㆍ학년ㆍ반ㆍ번호와 날씨ㆍ온도를 모두 선택해주세요.";
      errorMsg.style.display = "block";
      return;
    }
    errorMsg.style.display = "none";

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "저장 중...";

    const params = new URLSearchParams({
      timestamp: new Date().toISOString(),
      grade: grade, classNo: classNo, stuNo: stuNo, name: stuName,
      weather: selectedWeather.key, category: selectedWeather.cat,
      temp: selectedTemp, reason: reason
    });

    fetch(SHEET_ENDPOINT + "?" + params.toString(), { method: "GET", mode: "no-cors" })
      .then(() => {
        const rx = PRESCRIPTIONS[selectedWeather.cat];
        document.getElementById('resultIcon').textContent = rx.icon;
        document.getElementById('rxTitle').textContent = rx.title;
        document.getElementById('rxBody').textContent = rx.body;
        document.getElementById('formWrap').classList.add('hidden');
        document.getElementById('resultScreen').classList.add('show');
      })
      .catch(() => {
        errorMsg.textContent = "저장에 실패했어요. 다시 시도해주세요.";
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "제출하기";
      });
  }
</script>

</body>
</html>

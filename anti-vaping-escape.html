<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B3A6B">
<title>금연 방탈출 — POGOK WELL+</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@900&display=swap');

  :root{
    --navy:#1B3A6B; --teal:#028090; --mint:#02C39A; --coral:#FF6B4A; --gold:#FFB627;
    --ink:#1B2436; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;
       word-break:keep-all;overflow-wrap:break-word;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  /* 상단: 제목 + 열쇠 7개 진행 표시 */
  .top{background:var(--navy);color:#fff;padding:18px 20px 16px;}
  .brand{margin:0;font-size:12.5px;color:#B9C6E0;}
  .top h1{margin:2px 0 12px;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:27px;}
  .locks{display:flex;gap:7px;}
  .lock{flex:1;height:36px;border-radius:10px;border:1.5px solid #5272a6;color:#8fa6cf;
        display:grid;place-items:center;transition:background .3s,border-color .3s,transform .3s;}
  .lock svg{width:19px;height:19px;}
  .lock .key{display:none;}
  .lock.now{border-color:#fff;color:#fff;}
  .lock.got{background:var(--gold);border-color:var(--gold);color:#4a3000;transform:translateY(-2px);}
  .lock.got .key{display:block;}
  .lock.got .pad{display:none;}

  main{flex:1;padding:20px 18px 12px;}
  h2.step{margin:16px 0 6px;font-size:19px;font-weight:900;color:var(--navy);}
  .lead{margin:0 0 10px;font-size:15px;}
  .tiny{margin:10px 0 0;font-size:12.5px;color:var(--muted);text-align:center;}

  /* 마냥이 (갇힘 → 탈출) */
  .row{display:flex;gap:12px;align-items:center;}
  .cage{position:relative;flex:0 0 auto;width:132px;height:132px;margin:0 auto 8px;border-radius:50%;
        background:#e4ebf6;display:grid;place-items:center;overflow:hidden;}
  .cage.sm{width:58px;height:58px;margin:0;}
  .cage img{width:88%;height:88%;object-fit:contain;}
  .m-emoji{font-size:66px;line-height:1;}
  .cage.sm .m-emoji{font-size:30px;}
  .cage::after{content:"";position:absolute;inset:0;
        background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(27,36,54,.8) 13px 17px);
        transition:transform 1s ease,opacity 1s ease;}
  .cage.free::after{transform:translateY(-110%);opacity:0;}
  .bubble{position:relative;flex:1;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;font-size:14.5px;font-weight:500;}
  .bubble.center{margin:0 0 16px;text-align:center;}
  .row .bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:#fff;
        border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:translateY(-50%) rotate(45deg);}

  /* 큰 마냥이 우리 (첫 화면 · 탈출 성공 화면) */
  .cage.xl{width:min(68vw,250px);height:min(68vw,250px);margin:0 auto;
        background:radial-gradient(circle at 50% 38%,#34568f 0%,#16294e 72%);
        box-shadow:0 0 0 4px rgba(255,255,255,.14),0 20px 44px rgba(0,0,0,.5);}
  .cage.xl .m-emoji{font-size:140px;}
  .cage.xl::after{z-index:1;background:repeating-linear-gradient(90deg,transparent 0 23px,#0a1127 23px 31px,#4b608c 31px 32px);}
  .cage.xl::before{content:"🔒";position:absolute;z-index:2;left:50%;bottom:5%;font-size:42px;line-height:1;
        transform:translateX(-50%);transition:transform .8s ease,opacity .8s ease;}
  .cage.xl.free::before{opacity:0;transform:translate(-50%,50px);}
  .cage.xl.rattle{animation:rattle .7s .4s 1;}

  /* 첫 화면 히어로 */
  main.hero-mode{padding:0;}
  .hero{position:relative;overflow:hidden;padding:22px 22px 26px;text-align:center;color:#fff;
        background:linear-gradient(180deg,#1B3A6B 0%,#0d1830 100%);}
  .hero > *:not(.smoke){position:relative;z-index:1;}
  .smoke{position:absolute;border-radius:50%;filter:blur(32px);animation:drift 15s ease-in-out infinite alternate;}
  .smoke.s1{width:230px;height:230px;left:-70px;top:30px;background:#7fa4ff;opacity:.32;}
  .smoke.s2{width:270px;height:270px;right:-100px;bottom:40px;background:#02C39A;opacity:.16;animation-duration:19s;}
  .cage-wrap{position:relative;width:fit-content;margin:8px auto 0;}
  .plead{position:absolute;z-index:3;right:-16px;top:-8px;background:#fff;color:var(--ink);
        font:900 17px 'Noto Sans KR',sans-serif;padding:9px 15px;border-radius:16px 16px 16px 4px;
        transform-origin:20% 100%;animation:pop .5s .9s both cubic-bezier(.34,1.56,.64,1);}
  .hero-title{margin:16px 0 6px;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:42px;line-height:1.15;
        text-shadow:0 3px 0 #FF6B4A,0 10px 26px rgba(0,0,0,.45);}
  .hero-sub{margin:0;font-size:16px;font-weight:500;color:#cfe9e3;}
  .btn.hero-cta{max-width:320px;margin:18px auto 0;font-size:19px;padding:17px 10px;box-shadow:0 5px 0 #c04a30;}
  .btn.hero-cta:active{transform:translateY(3px);box-shadow:0 2px 0 #c04a30;}
  .hero-how{max-width:330px;margin:20px auto 0;padding-left:20px;text-align:left;font-size:13.5px;color:#cbd6ee;}
  .hero-how li{margin-bottom:4px;}
  .hero-tiny{margin:10px 0 0;font-size:12px;color:#8fa6cf;}

  /* 포스터 단서 */
  .clue{margin:0 0 14px;padding:14px 16px;background:#fff;border-left:5px solid var(--gold);
        border-radius:0 12px 12px 0;font-size:16.5px;font-weight:700;}
  .hanja-grid{display:grid;gap:10px;margin-top:6px;}
  .hanja-btn{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;
        background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;
        font-family:'Noto Serif KR',serif;font-weight:900;font-size:30px;color:var(--navy);}
  .hanja-btn small{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:var(--muted);}
  .hanja-btn.wrong{border-color:var(--coral);background:#fff3f0;color:#b8402a;animation:shake .35s;}
  .hanja-btn.right{border-color:var(--mint);background:#e8faf5;}

  .target{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding:12px 18px;background:#fff;
        border-left:5px solid var(--gold);border-radius:0 12px 12px 0;}
  .target .hj{font-family:'Noto Serif KR',serif;font-weight:900;font-size:36px;line-height:1.2;color:var(--navy);}
  .target .rd{font-size:14px;color:var(--muted);}

  /* 소문 판정 */
  .found{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-size:14px;color:var(--muted);}
  .found .hj{font-family:'Noto Serif KR',serif;font-weight:900;font-size:26px;color:var(--navy);}
  .claim{margin:0 0 14px;padding:14px 16px;background:#fff;border-left:5px solid var(--teal);
        border-radius:0 12px 12px 0;font-size:17px;font-weight:700;}
  .tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opts{display:grid;gap:10px;}
  .opt{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;
        font:500 15.5px 'Noto Sans KR',sans-serif;color:var(--ink);cursor:pointer;}
  .opt.wrong{border-color:var(--coral);background:#fff3f0;animation:shake .35s;}
  .opt.right{border-color:var(--mint);background:#e8faf5;font-weight:700;}

  .btn{display:block;width:100%;border:0;border-radius:999px;padding:15px 10px;font:900 16px 'Noto Sans KR',sans-serif;cursor:pointer;}
  .btn.primary{background:var(--coral);color:#fff;margin-top:14px;}
  .btn.t{background:var(--teal);color:#fff;}
  .btn.f{background:var(--coral);color:#fff;}
  .btn.ghost{background:#e9edf3;color:#4b5563;margin-top:18px;}
  .btn:disabled,.opt:disabled,.hanja-btn:disabled{cursor:default;}
  .btn:disabled{opacity:.45;}

  .fb{min-height:22px;margin:10px 2px 0;font-size:14px;font-weight:700;color:#b8402a;}
  .result{margin-top:14px;padding:14px 16px;border-radius:14px;background:#e8faf5;border:1.5px solid var(--mint);}
  .result .res-title{margin:0 0 6px;font-weight:900;color:#067a63;}
  .result p{margin:0 0 8px;font-size:14.5px;}
  .result .say{margin:0;font-weight:700;color:var(--navy);}

  /* 탈출 성공 */
  .done{margin:4px 0 4px;text-align:center;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:32px;color:var(--navy);}
  .center{text-align:center;}
  .pledge{margin:14px 0 18px;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:56px;line-height:1.1;color:var(--coral);}
  .next-box{padding:14px 16px;background:#fff;border:1.5px solid var(--line);border-radius:14px;font-size:14.5px;}
  .next-box p{margin:0;}
  .help{margin:16px 0 0;font-size:13px;color:var(--muted);text-align:center;}

  footer{padding:14px 18px 26px;text-align:center;font-size:12px;color:var(--muted);}

  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes rattle{0%,100%{transform:rotate(0)}15%{transform:rotate(-3deg)}30%{transform:rotate(3deg)}45%{transform:rotate(-2deg)}60%{transform:rotate(2deg)}80%{transform:rotate(-1deg)}}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes drift{to{transform:translate(34px,-24px) scale(1.18)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="brand">포곡중학교 보건실 · POGOK WELL+</p>
    <h1>금연 방탈출</h1>
    <div class="locks" id="locks" role="img" aria-label="열쇠 0개 / 7개"></div>
  </header>

  <main id="stage"></main>

  <footer>포곡에서 건강을, 그 이상을</footer>
</div>

<script>
  /* ====== 여기만 고치면 문구가 바뀌어요 ====== */
  const CONFIG = {
    mascotSrc: "manyang.png",   // 같은 폴더에 마냥이 이미지(manyang.png)를 올리면 자동으로 표시돼요. 없으면 🐱 로 보여요.
    posterPlace: "보건실 앞 복도", // 포스터가 전시된 장소. 바뀌면 여기만 고치세요.
    endNote: "보건실에 와서 보건 선생님께 이 화면을 보여주고, 우리 반 칸에 스티커를 붙이고 가요.",
    helpLine: "담배를 끊고 싶거나 고민이 있을 땐 보건실로 와요.<br>금연상담전화 1544-9030 · 청소년전화 1388"
  };

  /* 포스터 6장 = 관문 6개. 문구는 포스터 설명과 작년 8차시 퀴즈에서 가져왔어요. */
  const READ = {"同害":"동해","毒霧":"독무","香毒":"향독","禁煙陷穽":"금연함정","入門關":"입문관","錯覺":"착각"};

  /* 포스터에 실제로 그려진 그림. 포스터를 직접 봐야 고를 수 있어요. */
  const PIC = {
    "同害":"담배를 두 개비 문 얼굴과 폐 엑스레이",
    "毒霧":"후드를 쓴 인물과 초록·보랏빛 독 안개",
    "香毒":"향수병에서 분홍 연꽃이 피어오르는 그림",
    "禁煙陷穽":"뾰족한 이빨 같은 구덩이 한가운데 서 있는 사람들",
    "入門關":"전자담배로 만든 거대한 문과 그 앞에 선 아이들",
    "錯覺":"얼굴이 회색과 분홍빛으로 반반 나뉜 여성"
  };

  const GATES = [
    { hanja:"同害", decoys:["毒霧","入門關"],
      clue:"‘덜 해롭다’는 거짓말. 결국 같은 해로움을 가진다.",
      meaning:"同(같을 동) + 害(해로울 해) = 똑같이 해롭다",
      claim:"전자담배는 일반 담배보다 덜 해롭다.", answer:false,
      explain:"이름만 다를 뿐, 니코틴과 발암물질 등 해로운 물질이 똑같이 들어 있어요. ‘덜 해롭다’가 가장 큰 거짓말이에요.",
      say:"‘덜 해롭다’는 말에 속지 않기!" },
    { hanja:"毒霧", decoys:["香毒","錯覺"],
      clue:"수증기가 아닌, 독성을 가진 안개(에어로졸)를 내뿜는다.",
      meaning:"毒(독 독) + 霧(안개 무) = 독 안개",
      claim:"전자담배에서 나오는 건 수증기가 아니라 니코틴과 발암물질이 든 ‘에어로졸’이다.", answer:true,
      explain:"전자담배에서 나오는 건 미세먼지, 니코틴, 발암물질이 든 에어로졸이에요. 옆에 있는 친구도 함께 마시게 돼요.",
      say:"수증기가 아니라 에어로졸! 기억해요." },
    { hanja:"香毒", decoys:["同害","禁煙陷穽"],
      clue:"달콤한 향기를 가진 독으로, 중독을 유발한다.",
      meaning:"香(향기 향) + 毒(독 독) = 향기로운 독",
      claim:"과일 향이 나니까 중독될 리 없다. 그냥 재미로 피우는 거다.", answer:false,
      explain:"향은 달콤한 가면일 뿐, 속의 니코틴은 그대로예요. 향은 오히려 청소년의 호기심을 자극해 중독으로 이끌어요.",
      say:"달콤한 향은 가면일 뿐이에요." },
    { hanja:"禁煙陷穽", decoys:["入門關","毒霧"],
      clue:"금연을 돕는 것이 아니라 금연을 방해하는 함정이다.",
      meaning:"禁煙(금연) + 陷穽(함정) = 금연의 함정",
      claim:"금연하려고 전자담배를 쓰다가, 일반 담배와 전자담배를 둘 다 피우게 되는 경우가 많다.", answer:true,
      explain:"금연에 실패하고 일반 담배와 전자담배를 둘 다 쓰는 ‘더블 스모커’가 되는 경우가 많아요. 니코틴 중독이 길어져 금연이 더 어려워져요.",
      say:"끊으려다 둘 다 피우게 되는 함정이에요." },
    { hanja:"入門關", decoys:["錯覺","同害"],
      clue:"담배의 세계로 들어서는 입문의 관문이 된다.",
      meaning:"入(들 입) + 門(문 문) + 關(관문 관) = 들어서는 관문",
      claim:"전자담배로 시작한 청소년은 일반 담배를 피울 가능성이 더 높다.", answer:true,
      explain:"전자담배는 호기심과 낮은 접근성 때문에 담배를 처음 시작하는 ‘문턱’이 돼요. 전자담배로 시작한 청소년은 일반 담배를 피울 가능성이 더 높아요.",
      say:"문턱을 안 넘는 게 제일 쉬워요." },
    { hanja:"錯覺", decoys:["香毒","禁煙陷穽"],
      clue:"스트레스 해소 효과는 뇌의 착각일 뿐이다.",
      meaning:"錯(어긋날 착) + 覺(깨달을 각) = 잘못 느끼는 착각",
      claim:"전자담배를 피우면 스트레스가 풀리고 집중이 잘 된다.", answer:false,
      explain:"니코틴의 편안함은 금단 증상이 잠깐 풀리는 ‘착각’이에요. 오래 보면 뇌 기능은 떨어지고 스트레스는 늘어요.",
      say:"편안한 느낌은 뇌의 착각이에요." }
  ];

  const LAST = {
    scene:"하교길, 친구가 전자담배를 내밀며 말해요.",
    line:"“야, 한 번만 해봐. 아무도 몰라.”",
    explainOk:"짧고 단호하게 ‘나 안 해’라고 말하고 다른 할 일을 제안하면, 분위기도 지킬 수 있어요. 진짜 친구라면 내 거절을 존중해요.",
    say:"나 안 해! 이 한마디면 충분해요.",
    options:[
      { text:"나 안 해. 대신 편의점 가서 음료수나 마시자!", ok:true },
      { text:"음… 딱 한 번만이다?", ok:false, why:"‘딱 한 번’이 시작이에요. 청소년의 뇌는 니코틴에 더 빨리 중독돼요." },
      { text:"나중에 생각해 볼게.", ok:false, why:"여지를 남기면 또 권해요. 짧고 분명하게 말해야 해요." },
      { text:"너 미쳤어? 그걸 왜 피워!", ok:false, why:"친구를 몰아세우면 싸움이 돼요. ‘나는 안 한다’만 단호하게 말하면 충분해요." }
    ]
  };

  /* ====== 동작 ====== */
  const stage = document.getElementById('stage');
  const locksEl = document.getElementById('locks');
  const state = { i:0, phase:'start', wrong:0, keys:0 };

  const LOCK_SVG = '<svg class="pad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const KEY_SVG  = '<svg class="key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M17 12v3M20 12v2"/></svg>';

  function shuffle(a){ a=a.slice(); for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }

  function buildLocks(){
    locksEl.innerHTML='';
    for(let k=0;k<7;k++){ const d=document.createElement('div'); d.className='lock'; d.innerHTML=LOCK_SVG+KEY_SVG; locksEl.appendChild(d); }
    updateLocks();
  }
  function updateLocks(){
    [...locksEl.children].forEach((el,k)=>{
      el.classList.toggle('got', k<state.keys);
      el.classList.toggle('now', k===state.keys && state.phase!=='start' && state.phase!=='end');
    });
    locksEl.setAttribute('aria-label','열쇠 '+state.keys+'개 / 7개');
    stage.classList.toggle('hero-mode', state.phase==='start');
  }

  function mascot(cls){
    return '<div class="cage '+cls+'"><img src="'+CONFIG.mascotSrc+'" alt="마냥이" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span class="m-emoji" style="display:none">🐱</span></div>';
  }
  function say(text){ return '<div class="row">'+mascot('sm')+'<div class="bubble">'+text+'</div></div>'; }
  const fb = () => document.getElementById('fb');

  function renderStart(){
    state.i=0; state.keys=0; state.wrong=0; state.phase='start'; updateLocks();
    stage.innerHTML =
      '<section class="hero">'+
        '<div class="smoke s1"></div><div class="smoke s2"></div>'+
        '<div class="cage-wrap"><div class="plead">도와줘요!</div>'+mascot('xl rattle')+'</div>'+
        '<h2 class="hero-title">마냥이가 갇혔다!</h2>'+
        '<p class="hero-sub">니코틴 하우스의 문은 7개.<br>열쇠를 모아 탈출시켜 주세요.</p>'+
        '<button class="btn primary hero-cta" data-act="start">탈출 시작</button>'+
        '<ol class="hero-how">'+
          '<li>'+CONFIG.posterPlace+'에 전시된 Anti-Vaping 포스터 앞으로 가요.</li>'+
          '<li>포스터를 직접 보고 그림을 맞힌 뒤, 소문이 진실인지 거짓인지 가려요.</li>'+
          '<li>마지막 문은 “한 번 해볼래?”를 거절하는 한마디예요.</li>'+
        '</ol>'+
        '<p class="hero-tiny">5분쯤 걸려요. 점수와 기록은 어디에도 저장되지 않아요.</p>'+
      '</section>';
  }

  function renderFind(){
    const g=GATES[state.i];
    state.phase='find'; state.wrong=0; updateLocks();
    const opts=shuffle([g.hanja].concat(g.decoys));
    stage.innerHTML =
      say(CONFIG.posterPlace+'에 전시된 포스터를 직접 보고 골라요!')+
      '<h2 class="step">문 '+(state.i+1)+' · 포스터 확인</h2>'+
      '<p class="lead">'+CONFIG.posterPlace+'에서 이 한자가 쓰인 포스터를 찾아요.</p>'+
      '<div class="target"><span class="hj">'+g.hanja+'</span><span class="rd">'+READ[g.hanja]+'</span></div>'+
      '<p class="lead">그 포스터에는 어떤 그림이 있나요?</p>'+
      '<div class="opts">'+opts.map(h=>'<button class="opt" data-act="pick" data-v="'+h+'">'+PIC[h]+'</button>').join('')+'</div>'+
      '<p class="fb" id="fb" role="status" aria-live="polite"></p>';
  }

  function renderJudge(){
    const g=GATES[state.i];
    state.phase='judge'; state.wrong=0; updateLocks();
    stage.innerHTML =
      say('포스터 문구가 힌트예요!')+
      '<h2 class="step">문 '+(state.i+1)+' · 소문 가리기</h2>'+
      '<div class="found"><span class="hj">'+g.hanja+'</span><span>'+READ[g.hanja]+' 포스터</span></div>'+
      '<p class="lead">이 소문, 진실일까요 거짓일까요?</p>'+
      '<blockquote class="claim">'+g.claim+'</blockquote>'+
      '<div class="tf"><button class="btn t" data-act="judge" data-v="T">진실</button><button class="btn f" data-act="judge" data-v="F">거짓</button></div>'+
      '<p class="fb" id="fb" role="status" aria-live="polite"></p>';
  }

  function gateCleared(){
    const g=GATES[state.i];
    state.keys++; updateLocks();
    const isLastPoster = state.i===GATES.length-1;
    stage.querySelectorAll('.btn.t,.btn.f').forEach(b=>b.disabled=true);
    fb().textContent='';
    stage.insertAdjacentHTML('beforeend',
      '<div class="result"><p class="res-title">열쇠 획득! 정답은 ‘'+(g.answer?'진실':'거짓')+'’이에요.</p>'+
      '<p>'+g.explain+'</p><p class="say">마냥이 한마디: “'+g.say+'”</p></div>'+
      '<button class="btn primary" data-act="next">'+(isLastPoster?'마지막 문으로 가기':'다음 문 열기')+'</button>');
    stage.querySelector('[data-act="next"]').focus();
  }

  function renderLast(){
    state.phase='last'; state.wrong=0; updateLocks();
    const opts=shuffle(LAST.options);
    stage.innerHTML =
      say('마지막 문이에요. 거의 다 왔어요!')+
      '<h2 class="step">문 7 · 마지막 문</h2>'+
      '<p class="lead">'+LAST.scene+'</p>'+
      '<blockquote class="claim">'+LAST.line+'</blockquote>'+
      '<p class="lead">저를 구할 마지막 열쇠는 어떤 한마디일까요?</p>'+
      '<div class="opts">'+opts.map((o,idx)=>'<button class="opt" data-act="last" data-idx="'+LAST.options.indexOf(o)+'">'+o.text+'</button>').join('')+'</div>'+
      '<p class="fb" id="fb" role="status" aria-live="polite"></p>';
  }

  function renderEnd(){
    state.phase='end'; updateLocks();
    stage.innerHTML =
      mascot('xl')+
      '<h2 class="done">탈출 성공!</h2>'+
      '<p class="center">열쇠 7개를 모두 모았어요. 마냥이가 풀려났어요.</p>'+
      '<div class="pledge">나 안 해!</div>'+
      '<div class="next-box"><p>'+CONFIG.endNote+'</p></div>'+
      '<p class="help">'+CONFIG.helpLine+'</p>'+
      '<button class="btn ghost" data-act="restart">처음부터 다시 하기</button>';
    setTimeout(()=>{ const c=stage.querySelector('.cage'); if(c) c.classList.add('free'); }, 250);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  const actions = {
    start(){ renderFind(); },
    pick(btn){
      const g=GATES[state.i];
      if(btn.dataset.v===g.hanja){
        btn.classList.add('right');
        stage.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        setTimeout(renderJudge,500);
      } else {
        btn.classList.add('wrong'); btn.disabled=true; state.wrong++;
        fb().textContent = state.wrong>=2 ? '힌트: 한자 뜻을 보면 그림이 떠올라요. '+g.meaning : '아니에요. '+CONFIG.posterPlace+'의 포스터 그림을 다시 확인해요.';
      }
    },
    judge(btn){
      const g=GATES[state.i];
      const said = btn.dataset.v==='T';
      if(said===g.answer){ gateCleared(); }
      else {
        btn.disabled=true; state.wrong++;
        fb().textContent='다시 생각해 봐요. 포스터 문구가 힌트예요: “'+g.clue+'”';
      }
    },
    next(){
      if(state.phase==='last'){ renderEnd(); return; }
      state.i++;
      if(state.i<GATES.length){ renderFind(); } else { renderLast(); }
    },
    last(btn){
      const o=LAST.options[+btn.dataset.idx];
      if(o.ok){
        btn.classList.add('right');
        stage.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        state.keys++; updateLocks();
        fb().textContent='';
        stage.insertAdjacentHTML('beforeend',
          '<div class="result"><p class="res-title">마지막 열쇠 획득!</p><p>'+LAST.explainOk+'</p><p class="say">마냥이 한마디: “'+LAST.say+'”</p></div>'+
          '<button class="btn primary" data-act="next">문 열고 탈출하기</button>');
        stage.querySelector('[data-act="next"]').focus();
      } else {
        btn.classList.add('wrong'); btn.disabled=true;
        fb().textContent=o.why;
      }
    },
    restart(){ renderStart(); window.scrollTo({top:0,behavior:'smooth'}); }
  };

  /* 마지막 문에서 '다음'을 누르면 탈출 화면으로 가도록 phase 구분 */
  stage.addEventListener('click', e=>{
    const b=e.target.closest('[data-act]');
    if(!b || b.disabled) return;
    actions[b.dataset.act](b);
  });

  buildLocks();
  renderStart();
</script>
</body>
</html>
